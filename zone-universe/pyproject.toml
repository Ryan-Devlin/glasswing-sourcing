[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zone-universe"
version = "0.1.0"
description = "ICANN zone-file domain discovery, crawling, and search engine"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiodns>=3.2,<5",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
