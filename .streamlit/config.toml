[client]
# main.py uses st.navigation(..., position="top"), but Streamlit's classic
# auto-sidebar-from-pages-directory behavior (this option's default) still
# applies whenever a pages/ directory exists -- on a direct/fresh URL load
# (not client-side routed from within the app), the client hydrates with
# that default sidebar before/instead of the custom top nav taking over,
# and it doesn't self-correct for the rest of that session. Force it off
# so the top nav is the only navigation, unconditionally.
showSidebarNavigation = false

[theme]
base = "light"

# Warm off-white surfaces instead of Streamlit's stark white/gray, near-black
# text instead of default gray-black, a single clean blue accent instead of
# Streamlit's default red/pink. Values from a validated, colorblind-safe
# reference palette (see dataviz skill: references/palette.md).
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "rgba(11, 11, 11, 0.10)"
linkColor = "#2a78d6"

font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true

# Metric tiles (st.metric) are used heavily on the main dashboard -- give the
# value real visual weight so the tiles read as a KPI row, not plain text.
metricValueFontSize = "2rem"
metricValueFontWeight = 600

dataframeBorderColor = "rgba(11, 11, 11, 0.10)"
dataframeHeaderBackgroundColor = "#f0efec"

# Same 8-hue order used for any charts in the app -- picked (and validated)
# so adjacent colors stay distinguishable under color-blindness simulation,
# not just for normal vision.
chartCategoricalColors = [
    "#2a78d6", "#eb6834", "#1baf7a", "#eda100",
    "#e87ba4", "#008300", "#4a3aa7", "#e34948",
]
chartSequentialColors = [
    "#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5",
    "#256abf", "#1c5cab", "#184f95", "#0d366b",
]
chartDivergingColors = [
    "#0d366b", "#256abf", "#6da7ec", "#cde2fb",
    "#f0efec", "#f4c2c1", "#e88a89", "#d03b3b", "#8a1f1f",
]

[theme.sidebar]
backgroundColor = "#f0efec"
